name: Validate Doppler website and Pages export

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate approved marketing pages and assets
        run: node scripts/build.mjs
      - name: Validate routes, assets and contact flows
        run: node scripts/check.mjs
      - name: Verify static export and form routing
        run: node --experimental-strip-types --test tests/export-pages.test.mjs tests/care-quiz.test.mjs tests/lead-origin.test.mjs
      - name: Export the GitHub Pages website
        run: node scripts/export-pages.mjs --output "$RUNNER_TEMP/doppler-pages"
